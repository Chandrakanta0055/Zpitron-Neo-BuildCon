<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        .bg-premium-gold-gradient {
            background-image: linear-gradient(135deg, #E8B84B 0%, #C9A227 50%, #A07820 100%);
        }
        .glass-card {
            background-color: rgba(15, 58, 32, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(232, 223, 192, 0.2);
            border-left: 1px solid rgba(232, 223, 192, 0.1);
            border-bottom: 1px solid rgba(232, 223, 192, 0.05);
            border-right: 1px solid rgba(232, 223, 192, 0.05);
            box-shadow: 0 4px 30px rgba(0, 10, 5, 0.6), inset 0 0 20px rgba(232, 223, 192, 0.05);
        }
        .input-glass {
            background-color: rgba(5, 23, 10, 0.5);
            border: 1px solid rgba(232, 223, 192, 0.2);
            transition: all 0.3s ease;
        }
        .input-glass:focus {
            border-color: #ecc246;
            box-shadow: 0 0 15px rgba(236, 194, 70, 0.2), inset 0 0 10px rgba(236, 194, 70, 0.1);
            outline: none;
        }
        .btn-gold {
            position: relative;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-gold::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .btn-gold:hover::before {
            opacity: 1;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(236, 194, 70, 0.3);
        }
        .btn-gold:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(236, 194, 70, 0.4);
        }
        
        @keyframes lockEntrance {
            0% { transform: translateY(-20px) scale(0.8); opacity: 0; }
            60% { transform: translateY(5px) scale(1.1); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .lock-anim {
            animation: lockEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
    </style>

<h2 class="font-headline-md text-headline-md text-primary tracking-wide text-center">Admin Portal</h2>
<p class="font-body-md text-body-md text-on-surface-variant tracking-widest uppercase mt-2">ZIPTRON NEO BUILDCON</p>
</div>
<!-- Glass Card -->
<div class="glass-card rounded-2xl w-full max-w-md p-8 md:p-10 relative overflow-hidden">

<div class="absolute top-0 left-0 w-8 h-8 border-t border-l border-primary/50 opacity-50"></div>

<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2 relative">
<label class="font-label-bold text-label-bold text-soft-cream/80 uppercase tracking-wider block" for="email">Admin Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">person</span>
</div>
<input class="input-glass w-full rounded-lg py-3 pl-10 pr-4 text-on-background font-body-md placeholder:text-outline-variant focus:ring-0" id="email" placeholder="executive@ziptronneo.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2 relative">
<div class="flex justify-between items-center">
<label class="font-label-bold text-label-bold text-soft-cream/80 uppercase tracking-wider block" for="password">Security Key</label>
<a class="font-caption text-caption text-primary hover:text-primary-fixed transition-colors" href="#">Recover Access</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">lock</span>
</div>
<input class="input-glass w-full rounded-lg py-3 pl-10 pr-12 text-on-background font-body-md placeholder:text-outline-variant focus:ring-0" id="password" placeholder="••••••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline-variant hover:text-primary transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibilityIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant bg-surface-container text-primary focus:ring-primary/50 focus:ring-offset-background" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-caption text-caption text-on-surface-variant" for="remember-me">
                        Authorize current terminal
                    </label>
</div>
<!-- Divider -->
<div class="h-px w-full bg-gradient-to-r from-transparent via-primary/30 to-transparent my-6"></div>
<!-- Submit Button -->
<button class="btn-gold bg-premium-gold-gradient w-full rounded-lg py-4 px-6 flex justify-center items-center gap-2 group" type="submit">
<span class="font-label-bold text-label-bold text-on-primary-container uppercase tracking-wider">Login to Dashboard</span>
<span class="material-symbols-outlined text-on-primary-container text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Security Badge -->
<div class="mt-8 flex items-center justify-center gap-2 text-outline-variant">
<span class="material-symbols-outlined text-[16px] fill">shield</span>
<span class="font-caption text-caption uppercase tracking-widest">Encrypted Connection</span>
</div>
</div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibilityIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
            }
        }
    </script>
